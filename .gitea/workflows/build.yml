name: Build and Push

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Runner mounts the host's docker.sock, so the underlying Docker daemon (and its
          # image/layer cache) is already shared and persistent across runs. The default
          # "docker-container" driver would still spin up an isolated BuildKit instance with
          # its own separate cache store each run, ignoring that - "docker" driver uses the
          # host daemon's own builder directly, so the ext/ build stage only re-runs when
          # ext/ actually changes instead of on every push.
          driver: docker

      - name: Log in to Gitea Registry
        uses: docker/login-action@v3
        with:
          registry: git.patrick-dev.net
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            git.patrick-dev.net/${{ secrets.REGISTRY_USER }}/kemono-downloader:latest
            git.patrick-dev.net/${{ secrets.REGISTRY_USER }}/kemono-downloader:${{ gitea.sha }}